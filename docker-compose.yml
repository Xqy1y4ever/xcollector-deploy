# Xcollector 的编排（后端 + bot）
#
#   xcollector-web **不在这里** —— 它只负责产出 dist/，不参与运行时。
#   你需要自己用一个 web server 托管 dist/，并把两个前缀反代到本编排发布的端口：
#
#       /      → dist/ 静态文件
#       /api/  → 127.0.0.1:8000   （后端，前缀保留）
#
#   bot 的 8082 **不要反代到公网**：它只认管理令牌，是运营者视角的接口
#   （所有人的盲区计数、OneBot 连接状态），在浏览器里没有它的位置。
#
#   这两个端口是默认值，可以在 .env 里用 BACKEND_HOST_PORT / BOT_HOST_PORT 改
#   （宿主机端口被占时用得上）—— 改了记得同步反向代理里的地址。
#
#   静态文件与这两个反代必须**同源**（同一个 host:port），否则浏览器会跨域。
#   现成配置见 README「托管 dist」一节（nginx 与 Caddy 各一份）。
#
#   这份文件只拉镜像、不构建。想在本地从源码构建，叠加 docker-compose.build.yml：
#       docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
#
# 用法：cp .env.example .env 后改几项，再 docker compose up -d
# 详见 README.md

name: xcollector

# 镜像地址与版本都在 .env 里配（默认指向 ghcr.io/xqy1y4ever/*）。
# 注意：**GHCR 的镜像路径必须全小写**，用户名里的 X 要写成 x。
x-backend-image: &backend-image "${IMAGE_BACKEND:-ghcr.io/xqy1y4ever/xcollector-backend}:${VERSION:-latest}"
x-bot-image: &bot-image "${IMAGE_BOT:-ghcr.io/xqy1y4ever/xcollector-bot}:${VERSION:-latest}"
x-client-image: &client-image "${IMAGE_CLIENT:-ghcr.io/xqy1y4ever/xcollector-client}:${VERSION:-latest}"

services:
  # ---------------- 纯数据层 ----------------
  backend:
    image: *backend-image
    container_name: xcollector-backend
    restart: unless-stopped
    # missing = 本地没有才拉；always = 每次 up 都去拉最新。
    # 想固定版本时把 .env 里的 VERSION 设成具体 tag（如 v1.2.0）再配合 missing。
    pull_policy: ${PULL_POLICY:-missing}
    env_file:
      - .env
    environment:
      # 容器内路径：DB 与附件都落在挂载卷上
      DB_PATH: data/xcollector.db
      ATTACHMENT_DIR: data/attachments
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: "8000"
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - backend-data:/app/data
    ports:
      # 绑本机：你的 web server 在同一台机器上反代它。
      # 如果 web server 在别的机器上，改成 "0.0.0.0:${BACKEND_HOST_PORT:-8000}:8000"
      # —— 但先想清楚网络边界：后端不带 TLS，直接暴露出去等于数据裸奔。
      #
      # 左边的宿主机端口可以在 .env 里改（BACKEND_HOST_PORT）。宿主机 8000 被占
      # 是部署时最常见的事故，改这里就行 —— 容器之间走 compose 内网
      # （bot 用的是 http://backend:8000），**不经过这个端口**，所以改了不影响
      # 任何容器间通信，只要把你的反向代理指到新端口即可。
      - "127.0.0.1:${BACKEND_HOST_PORT:-8000}:8000"
    networks: [xcollector]
    security_opt:
      - no-new-privileges:true

  # ---------------- 消息处理层 ----------------
  bot:
    image: *bot-image
    container_name: xcollector-bot
    restart: unless-stopped
    pull_policy: ${PULL_POLICY:-missing}
    env_file:
      - .env
    environment:
      # 容器内必须用服务名，不能用 127.0.0.1（那是容器自己）
      BACKEND_BASE_URL: http://backend:8000
      BOT_LISTEN_HOST: 0.0.0.0
      BOT_LISTEN_PORT: "8082"
      # 反向 WS 模式时 NapCat 从宿主机连进来，所以也要监听 0.0.0.0
      ONEBOT_LISTEN_HOST: 0.0.0.0
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      # 8082：bot 的 HTTP API（/api/status、/api/digest/*、/api/send/*）。
      # **它不面向浏览器**：多用户之后这些接口要管理令牌，而浏览器里只有用户
      # 自己的 UserToken（bot 不认识那种令牌）。发布出来是给运营者在本机
      # curl 用的，所以只绑 127.0.0.1 —— 不要反代到公网。
      - "127.0.0.1:${BOT_HOST_PORT:-8082}:8082"
      # 8081：只在 ONEBOT_MODE=server（NapCat 反向连过来）时才需要，
      # 那条连接来自宿主机，所以也要发布。
      # ⚠ 注意：ONEBOT_MODE=server 时，NapCat 里填的 URL 端口要跟
      #   ONEBOT_HOST_PORT 对上（默认 8081）。
      - "127.0.0.1:${ONEBOT_HOST_PORT:-8081}:8081"
    extra_hosts:
      # 让容器能用 host.docker.internal 指到宿主机（Linux 上需要这一行，
      # Docker Desktop for Windows/Mac 自带）
      - "host.docker.internal:host-gateway"
    depends_on:
      backend:
        condition: service_healthy
    networks: [xcollector]
    security_opt:
      - no-new-privileges:true

  # ---------------- 入库客户端（可选）----------------
  # 读一份**聊天记录数据库**（nt_msg_db_util 导出的 nt_msg_export.db），抽取通知后
  # 用某个用户自己的 UserToken 写进后端。它不连 QQ，所以入库不再依赖活的 OneBot。
  #
  # 用 profile 关着，因为：
  #   1. 它需要一个宿主机上的聊天记录库路径（`CLIENT_DB_HOST_PATH`），
  #      没有这个文件的人不该被一个起不来的容器烦到；
  #   2. 开了它就等于开了**第二条入库链路** —— 和 bot 同时跑会重复入库
  #      （两边的 message_id 格式不同，现有幂等键拦不住），所以必须由人明确选。
  #
  # 怎么用：docker compose --profile client up -d
  client:
    image: *client-image
    container_name: xcollector-client
    restart: unless-stopped
    profiles: ["client"]
    env_file:
      - .env
    environment:
      # 容器内走服务名；聊天记录库按下面的只读挂载挂在 /data 下
      BACKEND_BASE_URL: http://backend:8000
      CLIENT_DB_PATH: /data/nt_msg_export.db
      CLIENT_ATTACHMENT_ROOT: /data/attachments
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      # **只读**挂载：客户端绝不改动你的聊天记录库
      - "${CLIENT_DB_HOST_PATH:?用 client profile 时必须配 CLIENT_DB_HOST_PATH}:/data/nt_msg_export.db:ro"
      # 附件目录（可选）。没配时 compose 会建一个空目录，客户端会走降级路径
      # （只留 CDN 地址并标注 degraded），不会静默少一张图。
      - "${CLIENT_ATTACHMENT_HOST_PATH:-./attachments}:/data/attachments:ro"
    # 批处理客户端：容器里用 --loop，间隔由 CLIENT_POLL_SECONDS 控制。
    # 更愿意用宿主机的计划任务，就改成 ["--once"] 并去掉 restart。
    command: ["--loop"]
    depends_on:
      backend:
        condition: service_healthy
    networks: [xcollector]
    security_opt:
      - no-new-privileges:true

volumes:
  # 唯一需要保护的持久化数据：SQLite 库 + 附件字节
  backend-data:
    driver: local

networks:
  xcollector:
    driver: bridge

# ---------------------------------------------------------------------------
# NapCat 也不在这份编排里，这是刻意的
#
# NapCat 要跑在有 QQ 客户端的地方，通常就是你的宿主机或另一台机器，而且它的
# 安装/登录本来就由你自己完成。两种接法：
#
# A) 正向 WS（推荐，ONEBOT_MODE=client）
#    在 NapCat 里开一个 WebSocket 服务（端口 3001），然后在 .env 里设
#        ONEBOT_MODE=client
#        ONEBOT_WS_URL=ws://host.docker.internal:3001
#    extra_hosts 已经配好，容器能通过这个名字找到宿主机。
#
# B) 反向 WS（ONEBOT_MODE=server）
#    在 NapCat 里配反向 WebSocket，URL 填 ws://<你的宿主机IP>:8081/onebot/ws
#    （容器内的 8081 已经发布到宿主机 127.0.0.1:8081）。
#
# 想连另一台机器上的 NapCat，把 ONEBOT_WS_URL 换成那台的地址即可，
# 这时 extra_hosts 就不需要了。
#
# ⚠ 上线前确认：**没有别的东西也在连同一个 NapCat**。旧版后端会自己去连
#   OneBot，如果它还在跑，同一个 QQ 账号的消息会被两条链路各收一份、重复入库。
# ---------------------------------------------------------------------------
